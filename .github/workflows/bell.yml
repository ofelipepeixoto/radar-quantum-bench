name: Bell em CPU
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproducao:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Conferir a coleta publicada e formar um pacote novo
        run: |
          python -m radar_quantum_bench verify examples/bell.json
          python -m radar_quantum_bench run --output "$RUNNER_TEMP/bell.json"
          python -m radar_quantum_bench pack "$RUNNER_TEMP/bell.json" "$RUNNER_TEMP/bell.zip"
          python -m radar_quantum_bench check-package "$RUNNER_TEMP/bell.zip"
