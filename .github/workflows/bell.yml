name: API e catálogo em CPU
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproducao:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-api.txt
      - run: python -m unittest discover -s tests -v
      - name: Conferir a amostra Bell e os ZIPs publicados
        run: |
          python -m radar_quantum_bench verify examples/bell.json
          (cd artifacts && sha256sum -c SHA256SUMS)
          for name in Bell GHZ BV; do
            python -m radar_quantum_bench check-package "artifacts/Radar-Quantum-Bench-$name.zip"
          done
      - name: Executar e empacotar os três circuitos
        run: |
          for circuit in bell ghz bv; do
            python -m radar_quantum_bench verify "examples/catalogo/$circuit.json"
            python -m radar_quantum_bench run --circuit "$circuit" --output "$RUNNER_TEMP/$circuit.json"
            python -m radar_quantum_bench pack "$RUNNER_TEMP/$circuit.json" "$RUNNER_TEMP/$circuit.zip"
            python -m radar_quantum_bench check-package "$RUNNER_TEMP/$circuit.zip"
          done
      - name: Rodar a suíte dentro do pacote GHZ
        run: |
          python -m zipfile -e artifacts/Radar-Quantum-Bench-GHZ.zip "$RUNNER_TEMP/pacote-ghz"
          cd "$RUNNER_TEMP/pacote-ghz"
          python -m unittest discover -s tests -v
  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-api.txt
      - run: npm ci
        working-directory: web
      - run: npm run check && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: interface-browser
          path: web/test-results
          retention-days: 7
