name: API e catálogo em CPU
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproducao:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-api.txt
      - run: python -m unittest discover -s tests -v
      - name: Conferir a amostra Bell e os ZIPs publicados
        run: |
          python -m radar_quantum_bench verify examples/bell.json
          (cd artifacts && sha256sum -c SHA256SUMS)
          for name in Bell GHZ BV; do
            python -m radar_quantum_bench check-package "artifacts/Radar-Quantum-Bench-$name.zip"
          done
      - name: Executar e empacotar os três circuitos
        run: |
          for circuit in bell ghz bv; do
            python -m radar_quantum_bench verify "examples/catalogo/$circuit.json"
            python -m radar_quantum_bench run --circuit "$circuit" --output "$RUNNER_TEMP/$circuit.json"
            python -m radar_quantum_bench pack "$RUNNER_TEMP/$circuit.json" "$RUNNER_TEMP/$circuit.zip"
            python -m radar_quantum_bench check-package "$RUNNER_TEMP/$circuit.zip"
          done
      - name: Rodar a suíte dentro do pacote GHZ
        run: |
          python -m zipfile -e artifacts/Radar-Quantum-Bench-GHZ.zip "$RUNNER_TEMP/pacote-ghz"
          cd "$RUNNER_TEMP/pacote-ghz"
          python -m unittest discover -s tests -v
  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-api.txt
      - run: npm ci
        working-directory: web
      - run: npm run check && npm run build
        working-directory: web
      - name: Testar a interface no Chrome do runner
        run: |
          RQB_BROWSER_BIN="$(command -v google-chrome)"
          "$RQB_BROWSER_BIN" --version
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$RQB_BROWSER_BIN" npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: interface-browser
          path: web/test-results
          retention-days: 7
  candidata:
    needs: [reproducao, interface]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Preparar ambiente Python separado
        run: |
          python -m venv "$RUNNER_TEMP/candidate-venv"
          "$RUNNER_TEMP/candidate-venv/bin/python" -m pip install --require-hashes -r requirements-api.txt
          "$RUNNER_TEMP/candidate-venv/bin/python" -m pip check
          "$RUNNER_TEMP/candidate-venv/bin/python" tools/inventory_dependencies.py --check
      - name: Compilar com as versões travadas
        run: npm ci && npm run build
        working-directory: web
      - name: Gerar e conferir a candidata de revisão
        run: |
          mkdir -p "$RUNNER_TEMP/candidate-evidence"
          "$RUNNER_TEMP/candidate-venv/bin/python" -m radar_quantum_bench.release build --revision "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/candidate-evidence/Radar-Quantum-Bench-Candidata.zip"
          (cd "$RUNNER_TEMP/candidate-evidence" && sha256sum Radar-Quantum-Bench-Candidata.zip > SHA256SUMS && sha256sum -c SHA256SUMS)
          RQB_EXPECTED_DIGEST="$(cut -d ' ' -f 1 "$RUNNER_TEMP/candidate-evidence/SHA256SUMS")"
          "$RUNNER_TEMP/candidate-venv/bin/python" -m radar_quantum_bench.release verify "$RUNNER_TEMP/candidate-evidence/Radar-Quantum-Bench-Candidata.zip" --sha256 "$RQB_EXPECTED_DIGEST"
          "$RUNNER_TEMP/candidate-venv/bin/python" -m zipfile -e "$RUNNER_TEMP/candidate-evidence/Radar-Quantum-Bench-Candidata.zip" "$RUNNER_TEMP/candidate-extracted"
      - name: Ensaiar o pacote extraído e a restauração
        run: |
          "$RUNNER_TEMP/candidate-venv/bin/python" "$RUNNER_TEMP/candidate-extracted/tools/verify_candidate.py" --output "$RUNNER_TEMP/candidate-evidence/candidate-result.json"
      - name: Conferir o computador e registrar o recibo técnico
        run: |
          RQB_EXPECTED_DIGEST="$(cut -d ' ' -f 1 "$RUNNER_TEMP/candidate-evidence/SHA256SUMS")"
          "$RUNNER_TEMP/candidate-venv/bin/python" "$RUNNER_TEMP/candidate-extracted/tools/verify_workstation.py" --candidate "$RUNNER_TEMP/candidate-evidence/Radar-Quantum-Bench-Candidata.zip" --sha256 "$RQB_EXPECTED_DIGEST" --output "$RUNNER_TEMP/candidate-evidence/workstation-result.json"
          "$RUNNER_TEMP/candidate-venv/bin/python" -m radar_quantum_bench.acceptance --directory "$RUNNER_TEMP/pilot-acceptance" init --candidate "$RUNNER_TEMP/candidate-evidence/Radar-Quantum-Bench-Candidata.zip" --sha256 "$RQB_EXPECTED_DIGEST"
          "$RUNNER_TEMP/candidate-venv/bin/python" -m radar_quantum_bench.acceptance --directory "$RUNNER_TEMP/pilot-acceptance" import-technical --receipt "$RUNNER_TEMP/candidate-evidence/workstation-result.json"
          "$RUNNER_TEMP/candidate-venv/bin/python" -m radar_quantum_bench.acceptance --directory "$RUNNER_TEMP/pilot-acceptance" status --output "$RUNNER_TEMP/candidate-evidence/pilot-status.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidata-revisao-e-evidencias
          path: ${{ runner.temp }}/candidate-evidence
          retention-days: 14
